name:                Banking
version:             0.1.0.0
license:             BSD-3-Clause
author:              "FP-mini 2026CS"
maintainer:          "example@example.com"
copyright:           "2026"

extra-source-files:
- README.md
- CHANGELOG.md

description:         A tiny in-memory bank used to teach Software Transactional
                     Memory (STM) and parallelism in Haskell. See README.md for
                     the lecture walkthrough.

dependencies:
- base >= 4.7 && < 5
- stm
- async
- random

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  Banking-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Banking

tests:
  Banking-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Banking
