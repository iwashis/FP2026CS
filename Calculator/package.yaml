name:                Calculator
version:             0.1.0.0
license:             BSD-3-Clause
author:              "FP-mini 2026CS"
maintainer:          "example@example.com"
copyright:           "2026"

extra-source-files:
- README.md
- CHANGELOG.md

description:         Algebraic calculator built with a hand-written
                     Hutton/Meijer-style monadic parser (Lecture07).

dependencies:
- base >= 4.7 && < 5
- mtl >= 2.3.1
- transformers >= 0.6.1.0

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  Calculator-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Calculator

tests:
  Calculator-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - Calculator
    - QuickCheck
